<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaoke MVP</title>
    <link rel="stylesheet" href="./css/common.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 2rem;
            background: var(--surface-color);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            color: var(--text-secondary);
        }
        .btn-large {
            display: inline-block;
            padding: 1rem 2rem;
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            background: var(--primary-color);
            border: none;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-large:hover {
            background: var(--primary-hover);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>KARAOKE</h1>
        <p>Mở trang TV để tạo phòng karaoke.<br>Người khác dùng điện thoại quét QR để tham gia.</p>
        <a href="./tv.html" class="btn-large">MỞ TRANG TV</a>
    </div>
</body>
</html>
